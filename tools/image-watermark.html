    <meta charset="UTF-8">

    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon.svg">

    <meta name="robots" content="index, follow">
    <meta name="description" content="Free Image Watermark Tool - Add custom text watermarks to your photos online. Protect your images with branded watermarks.">
    <meta name="keywords" content="image watermark, photo watermark, add watermark online, watermark tool, brand image">
    <link rel="canonical" href="https://prosoftwaretools.com/tools/image-watermark.html">
    <title>Image Watermark - Free Online Watermark Tool | ProSoftwareTools</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="../css/style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
</head>
<body>
    <header class="header">
        <div class="container">
            <nav class="navbar">
                <a href="../index.html" class="logo"><img src="../assets/images/logo.svg" alt="Pro Software Tools" width="300" height="50" style="height:40px;"></a>
                <div class="nav-menu" id="navMenu">
                    <ul class="nav-links">
                        <li><a href="../index.html">Home</a></li>
                        <li><a href="../index.html#categories">Categories</a></li>
                        <li><a href="../index.html#tools" class="active">All Tools</a></li>
                        <li><a href="../about.html">About</a></li>
                        <li><a href="../contact.html">Contact</a></li>
                    </ul>
                </div>
                <div class="nav-actions">
                    <button class="mobile-toggle" id="mobileToggle"><i class="fas fa-bars"></i></button>
                </div>
            </nav>
        </div>
    </header>

    <div class="breadcrumb">
        <div class="container">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="../categories/image-design.html">Image & Design</a></li>
                <li>Image Watermark</li>
            </ul>
        </div>
    </div>

    <section class="tool-page">
        <div class="container">
            <div class="tool-header">
                <h1><i class="fas fa-stamp"></i> Image Watermark</h1>
                <p>Add custom text watermarks to your images to protect and brand your photos</p>
            </div>

            <div class="tool-wrapper">
                <div class="form-group">
                    <label>Upload Image</label>
                    <input type="file" id="wmImageInput" accept="image/*" style="padding:12px; border:2px dashed var(--border); border-radius:var(--radius); width:100%;">
                </div>

                <div id="wmImagePreview" style="display:none; margin:20px 0;">
                    <h4 style="font-size:0.85rem; color:var(--gray); margin-bottom:8px;">ORIGINAL</h4>
                    <img id="wmPreviewImg" style="max-width:100%; max-height:200px; border-radius:var(--radius); border:1px solid var(--border);">
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label for="wmText">Watermark Text</label>
                        <input type="text" id="wmText" value="ProSoftwareTools" oninput="applyWatermark()">
                    </div>
                    <div class="form-group">
                        <label for="wmPosition">Position</label>
                        <select id="wmPosition" onchange="applyWatermark()" style="padding:12px 16px; border:2px solid var(--border); border-radius:var(--radius); font-size:0.95rem;">
                            <option value="bottom-right">Bottom Right</option>
                            <option value="bottom-left">Bottom Left</option>
                            <option value="top-right">Top Right</option>
                            <option value="top-left">Top Left</option>
                            <option value="center">Center</option>
                            <option value="tile">Tile (Repeated)</option>
                        </select>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label for="wmFontSize">Size</label>
                        <input type="number" id="wmFontSize" value="40" min="10" max="200" oninput="applyWatermark()">
                    </div>
                    <div class="form-group">
                        <label for="wmOpacity">Opacity (%)</label>
                        <input type="number" id="wmOpacity" value="50" min="10" max="100" oninput="applyWatermark()">
                    </div>
                    <div class="form-group">
                        <label for="wmColor">Color</label>
                        <input type="color" id="wmColor" value="#ffffff" onchange="applyWatermark()" style="height:48px;">
                    </div>
                </div>

                <div class="btn-group">
                    <button class="btn-primary" onclick="applyWatermark()"><i class="fas fa-stamp"></i> Apply Watermark</button>
                    <button class="btn-secondary" onclick="downloadWatermarked()"><i class="fas fa-download"></i> Download</button>
                </div>

                <div id="wmResult" style="display:none; margin-top:20px;">
                    <h4 style="font-size:0.85rem; color:var(--gray); margin-bottom:8px;">WATERMARKED RESULT</h4>
                    <canvas id="wmCanvas" style="max-width:100%; border-radius:var(--radius); border:1px solid var(--border);"></canvas>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 ProSoftwareTools.com. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <script src="../js/main.js" defer></script>
    <script src="../js/tools/image-watermark.js" defer></script>
</body>
</html>
